<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FLOW YMS | Acesso ao Sistema</title>
  <meta name="theme-color" content="#ffffff">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { background-color: #ffffff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .slide-in-right { animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    
    /* Inputs Flat e Executivos */
    .input-moderno { 
      width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; color: #1e293b; 
      font-weight: 600; border-radius: 0.5rem; padding: 0.875rem 1.25rem; padding-left: 3rem;
      transition: all 0.2s; outline: none; font-size: 0.95rem;
    }
    .input-moderno:focus { background-color: #ffffff; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
    .label-moderno { display: block; font-size: 0.70rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    
    /* Input customizado pro SweetAlert */
    .swal2-input-custom { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.75rem 1rem; margin-bottom: 1rem; font-weight: 600; color: #1e293b; outline: none; transition: all 0.2s; box-sizing: border-box; }
    .swal2-input-custom:focus { border-color: #3b82f6; background-color: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

    /* Fundo da Esquerda */
    .bg-corporate { background-color: #f8fafc; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px; }
  </style>
</head>

<body class="w-full relative flex antialiased">
  
  <!-- ================= PAINEL ESQUERDO (BRANDING) ================= -->
  <!-- Escondido no celular, visível a partir de telas médias (tablets/desktops) -->
  <div class="hidden lg:flex w-[55%] bg-blue-600 relative items-center justify-center overflow-hidden">
    <!-- Decoração geométrica flat -->
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-blue-500 rounded-full opacity-50 blur-3xl"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-blue-700 rounded-full opacity-50 blur-3xl"></div>
    
    <div class="relative z-10 p-16 max-w-xl text-white fade-in">
      <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mb-8 shadow-lg">
        <i class="fa-solid fa-truck-fast text-3xl text-blue-600"></i>
      </div>
      <h1 class="text-5xl font-black mb-4 tracking-tight leading-tight">Inteligência em Gestão de Pátio</h1>
      <p class="text-blue-100 text-lg font-medium leading-relaxed mb-8">
        Controle de fluxo, telemetria de docas e visibilidade total da operação rodoviária da Tamco em tempo real.
      </p>
      
      <div class="flex items-center gap-4 text-sm font-bold text-blue-200">
        <div class="flex items-center gap-2"><i class="fa-solid fa-check-circle text-emerald-400"></i> Check-in Rápido</div>
        <div class="flex items-center gap-2"><i class="fa-solid fa-check-circle text-emerald-400"></i> SLA de Doca</div>
        <div class="flex items-center gap-2"><i class="fa-solid fa-check-circle text-emerald-400"></i> Rastreabilidade</div>
      </div>
    </div>
  </div>

  <!-- ================= PAINEL DIREITO (LOGIN) ================= -->
  <div class="w-full lg:w-[45%] flex items-center justify-center bg-white relative z-10 shadow-[-20px_0_40px_-15px_rgba(0,0,0,0.05)]">
    
    <div class="w-full max-w-[420px] p-8 sm:p-12 slide-in-right">
      
      <!-- Cabeçalho (Aparece mais destacado no mobile, sutil no desktop) -->
      <div class="mb-10 lg:mb-12">
        <h2 class="text-3xl font-black tracking-tight text-slate-800 mb-1">Acessar FLOW<span class="text-blue-600">YMS</span></h2>
        <p class="text-sm font-semibold text-slate-500">Unidade Operação Tamco</p>
      </div>

      <form id="formLogin" class="w-full space-y-6" onsubmit="realizarLogin(event)">
        
        <div>
          <label class="label-moderno">Login de Usuário</label>
          <div class="relative">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 text-center"><i class="fa-solid fa-user"></i></div>
            <input type="text" id="inpUsuario" placeholder="Digite seu usuário..." class="input-moderno lowercase" required autocomplete="off">
          </div>
        </div>

        <div>
          <label class="label-moderno">Senha de Acesso</label>
          <div class="relative">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 text-center"><i class="fa-solid fa-lock"></i></div>
            <input type="password" id="inpSenha" placeholder="Sua senha..." class="input-moderno" required>
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" id="btnLogin" class="w-full bg-slate-800 hover:bg-blue-600 active:scale-95 text-white font-bold py-3.5 rounded-lg text-sm transition-all shadow-md flex justify-center items-center gap-2">
            Acessar Sistema <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>

      </form>
      
      <div class="mt-12 pt-6 border-t border-slate-100 text-center">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"><i class="fa-solid fa-shield-halved mr-1"></i> Ambiente Seguro e Monitorado</p>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://nzoxwptrymtkfhdyzrgl.supabase.co';
    const supabaseKey = 'sb_publishable_zhURV-j6cbu0bsQ_yeWbrw_cBFeX1UK';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    window.onload = function() {
      localStorage.removeItem('flowYmsPerfil');
      localStorage.removeItem('flowYmsUser');
    }

    async function realizarLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-lg"></i>'; btn.disabled = true;

      const usuario = document.getElementById('inpUsuario').value.trim().toLowerCase();
      const senha = document.getElementById('inpSenha').value.trim();

      const { data, error } = await client.from('usuarios_yms').select('id, perfil, ativo, senha').eq('usuario', usuario).single();

      if (error || !data) {
        mostrarErro('Usuário não localizado.'); resetarBotao(btn); return;
      }
      if (!data.ativo) {
        mostrarErro('Acesso inativado pelo administrador.'); resetarBotao(btn); return;
      }
      if (data.senha !== senha) {
        mostrarErro('Senha incorreta.'); resetarBotao(btn); return;
      }

      // REGRA DE SEGURANÇA: TROCA DE SENHA OBRIGATÓRIA
      if (senha === '1234') {
        forcarTrocaSenha(data.id, usuario, data.perfil);
        resetarBotao(btn);
        return;
      }

      liberarAcesso(usuario, data.perfil);
    }

    function liberarAcesso(usuario, perfil) {
      localStorage.setItem('flowYmsPerfil', perfil);
      localStorage.setItem('flowYmsUser', usuario.toUpperCase());
      window.location.href = 'painel.html';
    }

    async function forcarTrocaSenha(id, usuario, perfil) {
      const regexForte = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).+$/;

      const { value: novaSenha } = await Swal.fire({
        title: 'Atualização Obrigatória',
        html: `
          <div class="text-left mb-4">
            <p class="text-xs text-slate-500 font-medium mb-3">
              Sua senha é a padrão de fábrica. Por segurança, crie uma senha forte contendo:
            </p>
            <ul class="text-[11px] text-blue-600 font-bold bg-blue-50/50 p-3 rounded-lg space-y-1">
              <li><i class="fa-solid fa-check text-emerald-500 mr-1"></i> 1 Letra Maiúscula</li>
              <li><i class="fa-solid fa-check text-emerald-500 mr-1"></i> 1 Letra Minúscula</li>
              <li><i class="fa-solid fa-check text-emerald-500 mr-1"></i> 1 Número</li>
              <li><i class="fa-solid fa-check text-emerald-500 mr-1"></i> 1 Caractere Especial (@$!%*?&#)</li>
            </ul>
          </div>
          <input type="password" id="swal-pwd1" class="swal2-input-custom" placeholder="Digite a nova senha">
          <input type="password" id="swal-pwd2" class="swal2-input-custom mb-0" placeholder="Confirme a nova senha">
        `,
        focusConfirm: false, allowOutsideClick: false, showCancelButton: true, confirmButtonText: 'Salvar e Acessar', cancelButtonText: 'Cancelar',
        confirmButtonColor: '#1e293b', cancelButtonColor: '#94a3b8', customClass: { popup: 'rounded-2xl' },
        preConfirm: () => {
          const s1 = document.getElementById('swal-pwd1').value; const s2 = document.getElementById('swal-pwd2').value;
          if (!s1 || !s2) { Swal.showValidationMessage('Preencha os dois campos!'); return false; }
          if (s1 !== s2) { Swal.showValidationMessage('As senhas não conferem!'); return false; }
          if (!regexForte.test(s1)) { Swal.showValidationMessage('A senha não atende aos requisitos de segurança!'); return false; }
          return s1;
        }
      });

      if (novaSenha) {
        Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const { error } = await client.from('usuarios_yms').update({ senha: novaSenha }).eq('id', id);
        if (error) { Swal.fire('Erro', 'Falha ao atualizar senha', 'error'); return; }
        liberarAcesso(usuario, perfil);
      }
    }

    function mostrarErro(mensagem) {
      Swal.fire({ icon: 'error', title: 'Acesso Negado', text: mensagem, confirmButtonColor: '#3b82f6', customClass: { popup: 'rounded-2xl' } });
    }
    function resetarBotao(btn) { btn.innerHTML = 'Acessar Sistema <i class="fa-solid fa-arrow-right ml-1"></i>'; btn.disabled = false; }
  </script>
</body>
</html>
