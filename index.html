  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden;}
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* =======================================================
       LAYOUT DE IMPRESSÃO DA ETIQUETA (DEITADA 140mm x 90mm)
       Idêntico ao seu layout original, apenas com tamanho fixo
       ======================================================= */
    .preview-container { 
      display: flex; justify-content: center; align-items: center;
      background: #e2e8f0; padding: 20px; border-radius: 1.5rem; min-height: 450px;
    }
    
    .etiqueta-box {
      width: 140mm; height: 90mm; background: #ffffff; flex-shrink: 0;
      border: 2px solid #000000; box-sizing: border-box; padding: 0;
      color: #000000; display: flex; flex-direction: column;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; 
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }

    .table-etiqueta { width: 100%; flex-grow: 1; height: auto; border-collapse: collapse; table-layout: fixed; }
    .table-etiqueta td { border: 1px solid #000000; vertical-align: middle; overflow: hidden; font-size: 14px; padding: 2px 6px; line-height: 1.15; }
    
    .lbl-header { background-color: #8bb7e8 !important; font-weight: bold; text-transform: uppercase; width: 22%; color: #000000; font-size: 13px; }
    .lbl-header-half { width: 14%; background-color: #8bb7e8 !important; font-weight: bold; color: #000000; font-size: 13px; }
    
    .val-content { font-weight: 900; text-transform: uppercase; background-color: #ffffff !important; color: #000000; font-size: 24px; }
    .val-desc { font-weight: 900; background-color: #ffffff !important; color: #000000; font-size: 18px; }
    
    .footer-meta { display: flex; flex-shrink: 0; align-items: flex-end; justify-content: flex-end; font-weight: 600; color: #000000; padding-top: 2px; font-size: 10px; padding: 2px 4px; }

    .qrcode-container { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; padding: 2px 0; }
    .qrcode-container img, .qrcode-container canvas { width: 55px; height: 55px; }
    .qr-text { font-weight: 900; color: #000; margin-top: 2px; font-size: 12px; }

    @media print {
      @page { size: 140mm 90mm; margin: 0; }
      html, body { margin: 0 !important; padding: 0 !important; overflow: hidden !important; height: 100% !important; background: white !important; }
      body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body * { visibility: hidden; margin: 0; }
      .preview-container, .preview-container * { visibility: visible; }
      .preview-container { 
        position: fixed; left: 0; top: 0; margin: 0 !important; background: white !important; 
        display: flex; align-items: center; justify-content: center; border-radius: 0; box-sizing: border-box; 
        width: 140mm !important; height: 90mm !important;
      }
      .esconder-impressao, .sidebar, #sidebarOverlay { display: none !important; }
    }

    /* Tabelas SaaS Modernas e Inputs */
    .saas-table th { background-color: #f8fafc; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; border-bottom: 2px solid #f1f5f9; padding: 1.25rem 1rem; text-align: left; }
    .saas-table td { padding: 1.25rem 1rem; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.875rem; font-weight: 500; vertical-align: middle; }
    .saas-table tbody tr { transition: all 0.2s ease; background-color: #ffffff; }
    .saas-table tbody tr:hover { background-color: #f8fafc; }

    .input-moderno { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; color: #334155; font-weight: 600; border-radius: 0.75rem; padding: 0.75rem 1.25rem; transition: all 0.2s; outline: none; }
    .input-moderno:focus { background-color: #ffffff; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .label-moderno { display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }

    /* SweetAlert Custom UI (Modal de Senha e Avisos) */
    .swal-custom-popup { border-radius: 1.5rem !important; padding: 1.5rem !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important; border: 1px solid #f1f5f9 !important; }
    .swal-custom-title { font-family: 'Inter', sans-serif !important; font-weight: 900 !important; color: #1e293b !important; font-size: 1.25rem !important; }
    .swal-custom-html { font-family: 'Inter', sans-serif !important; color: #64748b !important; font-weight: 500 !important; font-size: 0.95rem !important; }
    .swal-btn-confirm { background-color: #2563eb !important; color: white !important; font-weight: 700 !important; border-radius: 0.75rem !important; padding: 0.75rem 1.5rem !important; margin: 0 0.25rem !important; transition: all 0.2s !important; }
    .swal-btn-confirm:hover { background-color: #1d4ed8 !important; }
    .swal-btn-cancel { background-color: #f1f5f9 !important; color: #64748b !important; font-weight: 700 !important; border-radius: 0.75rem !important; padding: 0.75rem 1.5rem !important; margin: 0 0.25rem !important; transition: all 0.2s !important; }
    .swal-btn-cancel:hover { background-color: #e2e8f0 !important; color: #475569 !important; }
    .swal-btn-danger { background-color: #ef4444 !important; color: white !important; font-weight: 700 !important; border-radius: 0.75rem !important; padding: 0.75rem 1.5rem !important; margin: 0 0.25rem !important; transition: all 0.2s !important; }
    .swal-btn-danger:hover { background-color: #dc2626 !important; }
  </style>
</head>

  <script>
    // ==========================================
    // INICIALIZAÇÃO DO SUPABASE E ESTILOS
    // ==========================================
    const supabaseUrl = 'https://nzoxwptrymtkfhdyzrgl.supabase.co';
    const supabaseKey = 'sb_publishable_zhURV-j6cbu0bsQ_yeWbrw_cBFeX1UK';
    const createSupabaseClient = window.supabase ? window.supabase.createClient : supabase.createClient;
    const client = createSupabaseClient(supabaseUrl, supabaseKey);

    var listaGlobalProdutos = [];
    let cadastroDesbloqueado = false; 

    const swalEstiloInput = `
      <style>
        .swal2-input {
          background-color: #f8fafc !important;
          border: 1px solid #e2e8f0 !important;
          border-radius: 0.75rem !important;
          box-shadow: none !important;
          color: #334155 !important;
          font-weight: 600 !important;
          height: 3rem !important;
          margin-top: 1rem !important;
        }
        .swal2-input:focus {
          background-color: #ffffff !important;
          border-color: #3b82f6 !important;
          box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        }
      </style>
    `;

    // ==========================================
    // NAVEGAÇÃO E SEGURANÇA (SPA & MOBILE)
    // ==========================================
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.classList.remove('opacity-0'), 10);
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
      }
    }

    function verificarAcessoCadastro() {
      if (cadastroDesbloqueado) {
        navegarPara('tela-cadastro');
        return;
      }

      Swal.fire({
        title: 'Acesso Restrito',
        html: swalEstiloInput + '<span style="font-size: 0.95rem; color: #64748b; font-weight: 500;">Digite a senha de liberação para acessar a base de dados.</span>',
        input: 'password',
        inputPlaceholder: 'Senha de validação...',
        showCancelButton: true,
        confirmButtonText: 'Validar',
        cancelButtonText: 'Cancelar',
        buttonsStyling: false,
        customClass: {
          popup: 'swal-custom-popup', title: 'swal-custom-title', htmlContainer: 'swal-custom-html',
          confirmButton: 'swal-btn-confirm', cancelButton: 'swal-btn-cancel'
        }
      }).then((result) => {
        if (result.isConfirmed) {
          if (result.value === '21082026@') {
            cadastroDesbloqueado = true;
            document.getElementById('iconLock').classList.replace('fa-lock', 'fa-lock-open');
            document.getElementById('iconLock').classList.replace('text-slate-500', 'text-emerald-400');
            navegarPara('tela-cadastro');
          } else {
            Swal.fire({
              icon: 'error', title: 'Acesso Negado', text: 'Senha incorreta.',
              buttonsStyling: false, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-btn-confirm' }
            });
          }
        }
      });
    }

    function navegarPara(telaId) {
      document.getElementById('btnNavEtiqueta').className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-semibold text-sm text-left hover:bg-slate-800 hover:text-white text-slate-400";
      document.getElementById('btnNavCadastro').className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-semibold text-sm text-left hover:bg-slate-800 hover:text-white text-slate-400";

      document.getElementById('tela-etiqueta').classList.add('hidden');
      document.getElementById('tela-cadastro').classList.add('hidden');
      document.getElementById('tela-cadastro').classList.remove('flex');

      if (telaId === 'tela-etiqueta') {
        document.getElementById('titulo-pagina').innerText = "Gerador de Etiquetas";
        document.getElementById('tela-etiqueta').classList.remove('hidden');
        document.getElementById('btnNavEtiqueta').className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold text-sm text-left bg-blue-600 text-white shadow-md shadow-blue-600/20";
      } else {
        document.getElementById('titulo-pagina').innerText = "Catálogo de Materiais";
        document.getElementById('tela-cadastro').classList.remove('hidden');
        document.getElementById('tela-cadastro').classList.add('flex');
        document.getElementById('btnNavCadastro').className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold text-sm text-left bg-blue-600 text-white shadow-md shadow-blue-600/20";
        carregarTabelaSupabase(); 
      }

      if (window.innerWidth < 768) {
        toggleSidebar();
      }
    }

    // ==========================================
    // LÓGICA DA TELA 2: CADASTRO
    // ==========================================
    async function carregarTabelaSupabase() {
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = `<tr><td colspan="4" class="text-center py-16 text-slate-400 font-bold"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500 block"></i> Sincronizando dados...</td></tr>`;
      
      const { data, error } = await client.from('produtos_tamco').select('id, cod_mat, descricao, medida').order('cod_mat', { ascending: true });

      if (error) {
        corpo.innerHTML = `<tr><td colspan="4" class="text-center py-16 text-rose-500 font-bold">Erro de comunicação com o banco de dados.</td></tr>`;
        return;
      }

      listaGlobalProdutos = data;
      renderizarTabela(listaGlobalProdutos);
    }

    function renderizarTabela(dados) {
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = '';

      if (dados.length === 0) {
        corpo.innerHTML = `<tr><td colspan="4" class="text-center py-16 text-slate-400 font-bold">Base de dados vazia.</td></tr>`;
        return;
      }

      dados.forEach(prod => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="font-bold text-slate-800 uppercase tracking-wide">${prod.cod_mat}</td>
          <td class="text-slate-600 font-semibold uppercase truncate max-w-[200px] sm:max-w-md">${prod.descricao}</td>
          <td class="text-center">
            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold border border-indigo-100">${prod.medida}</span>
          </td>
          <td class="text-right pr-4 md:pr-6">
            <div class="flex items-center justify-end gap-1 md:gap-2">
              <button onclick="abrirModalEditar('${prod.id}')" class="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-slate-100 text-slate-500 hover:bg-blue-500 hover:text-white transition-all shadow-sm flex items-center justify-center" title="Editar">
                <i class="fa-solid fa-pen text-xs md:text-sm"></i>
              </button>
              <button onclick="confirmarExclusao('${prod.id}', '${prod.cod_mat}')" class="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-slate-100 text-slate-500 hover:bg-rose-500 hover:text-white transition-all shadow-sm flex items-center justify-center" title="Excluir">
                <i class="fa-solid fa-trash text-xs md:text-sm"></i>
              </button>
            </div>
          </td>
        `;
        corpo.appendChild(tr);
      });
    }

    function filtrarTabela() {
      const termo = document.getElementById('campoBuscaLista').value.toLowerCase();
      const filtrados = listaGlobalProdutos.filter(p => p.cod_mat.toLowerCase().includes(termo) || p.descricao.toLowerCase().includes(termo));
      renderizarTabela(filtrados);
    }

    function abrirModalNovo() {
      document.getElementById('cadAcao').value = 'novo';
      document.getElementById('modal-titulo').innerHTML = `<div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-cube text-lg"></i></div> Novo Material`;
      document.getElementById('cadCodigo').value = "";
      document.getElementById('cadCodigo').disabled = false;
      document.getElementById('cadDescricao').value = "";
      document.getElementById('cadMedida').value = "KG";
      document.getElementById('modal-cadastro').classList.remove('hidden');
      setTimeout(() => document.getElementById('cadCodigo').focus(), 100);
    }

    function abrirModalEditar(id) {
      const prod = listaGlobalProdutos.find(p => p.id === id);
      if (!prod) return;
      document.getElementById('cadAcao').value = id;
      document.getElementById('modal-titulo').innerHTML = `<div class="w-10 h-10 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center"><i class="fa-solid fa-pen text-lg"></i></div> Editar Material`;
      document.getElementById('cadCodigo').value = prod.cod_mat;
      document.getElementById('cadCodigo').disabled = true; 
      document.getElementById('cadDescricao').value = prod.descricao;
      document.getElementById('cadMedida').value = prod.medida;
      document.getElementById('modal-cadastro').classList.remove('hidden');
      setTimeout(() => document.getElementById('cadDescricao').focus(), 100);
    }

    function fecharModalCadastro() {
      document.getElementById('modal-cadastro').classList.add('hidden');
    }

    function confirmarSalvamento() {
      const cod = document.getElementById('cadCodigo').value.trim();
      const desc = document.getElementById('cadDescricao').value.trim();
      
      if (!cod || !desc) {
        Swal.fire({
          icon: 'warning', title: 'Atenção', text: 'Preencha os campos obrigatórios.',
          buttonsStyling: false, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-btn-confirm' }
        });
        return;
      }

      Swal.fire({
        title: 'Confirmar Ação',
        text: "Deseja salvar as informações deste material no sistema?",
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sim, salvar',
        cancelButtonText: 'Cancelar',
        buttonsStyling: false,
        customClass: {
          popup: 'swal-custom-popup', title: 'swal-custom-title', htmlContainer: 'swal-custom-html',
          confirmButton: 'swal-btn-confirm', cancelButton: 'swal-btn-cancel'
        }
      }).then((result) => {
        if (result.isConfirmed) {
          executarSalvamentoBanco();
        }
      });
    }

    function confirmarExclusao(id, codMat) {
      Swal.fire({
        title: 'Excluir Material',
        html: `Remover definitivamente o item <b>${codMat}</b> do catálogo?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Excluir',
        cancelButtonText: 'Cancelar',
        buttonsStyling: false,
        customClass: {
          popup: 'swal-custom-popup', title: 'swal-custom-title', htmlContainer: 'swal-custom-html',
          confirmButton: 'swal-btn-danger', cancelButton: 'swal-btn-cancel'
        }
      }).then(async (result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: 'Excluindo...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }});
          const { error } = await client.from('produtos_tamco').delete().eq('id', id);
          if (error) {
            Swal.fire({ icon: 'error', title: 'Erro', text: 'Falha na exclusão.', buttonsStyling: false, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-btn-confirm' }});
          } else {
            Swal.fire({ icon: 'success', title: 'Excluído!', timer: 1500, showConfirmButton: false, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }});
            carregarTabelaSupabase();
          }
        }
      });
    }

    async function executarSalvamentoBanco() {
      const acaoId = document.getElementById('cadAcao').value;
      const cod = document.getElementById('cadCodigo').value.trim().toUpperCase();
      const desc = document.getElementById('cadDescricao').value.trim().toUpperCase();
      const med = document.getElementById('cadMedida').value;

      Swal.fire({ title: 'Processando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }});

      if (acaoId === 'novo') {
        const { error } = await client.from('produtos_tamco').insert([{ cod_mat: cod, descricao: desc, medida: med }]);
        if (error) return Swal.fire({ icon: 'error', title: 'Falha', text: 'O código pode já estar cadastrado.', buttonsStyling: false, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-btn-confirm' }});
      } else {
        const { error } = await client.from('produtos_tamco').update({ descricao: desc, medida: med }).eq('id', acaoId);
        if (error) return Swal.fire({ icon: 'error', title: 'Falha', text: 'Erro ao atualizar dados.', buttonsStyling: false, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title', confirmButton: 'swal-btn-confirm' }});
      }

      Swal.fire({ icon: 'success', title: 'Cadastro salvo!', timer: 1500, showConfirmButton: false, customClass: { popup: 'swal-custom-popup', title: 'swal-custom-title' }});
      fecharModalCadastro();
      carregarTabelaSupabase(); 
    }

    // ==========================================
    // LÓGICA DA TELA 1: ETIQUETAS
    // ==========================================
    function renderizarQR(elementId, textElementId, boxId, textPlaceholderId, valor) {
      const container = document.getElementById(elementId);
      container.innerHTML = ""; 
      const valorStr = String(valor || "").trim();
      if (valorStr !== "" && valorStr !== "-") {
        document.getElementById(textPlaceholderId).style.display = "none";
        document.getElementById(boxId).style.display = "flex";
        new QRCode(container, { text: valorStr, width: 100, height: 100, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.L });
        document.getElementById(textElementId).innerText = valorStr;
      } else {
        document.getElementById(textPlaceholderId).style.display = "block";
        document.getElementById(boxId).style.display = "none";
        document.getElementById(textPlaceholderId).innerText = "-";
      }
    }

    async function executarBusca(termo) {
      const termoLimpo = termo.trim();
      const caixa = document.getElementById('listaSugestoes');

      if (termoLimpo.length < 2) {
        caixa.style.display = 'none';
        return;
      }

      const { data, error } = await client.from('produtos_tamco').select('cod_mat, descricao, medida').or(`cod_mat.ilike.%${termoLimpo}%,descricao.ilike.%${termoLimpo}%`).limit(10);
      if (error) return;

      montarListaBusca(data);
    }

    function montarListaBusca(resultados) {
      var caixa = document.getElementById('listaSugestoes');
      caixa.innerHTML = '';
      if (!resultados || resultados.length === 0) {
        caixa.innerHTML = '<div class="p-4 text-slate-400 font-bold text-sm text-center">Nenhum material encontrado</div>';
        caixa.style.display = 'block';
        return;
      }
      resultados.forEach(function(prod) {
        var div = document.createElement('div');
        div.className = 'px-4 md:px-5 py-3 md:py-3.5 hover:bg-blue-50 cursor-pointer border-b border-slate-100 last:border-0 transition-colors text-sm text-slate-600 flex items-center gap-2 md:gap-3';
        div.innerHTML = `<span class="bg-slate-100 text-slate-700 font-mono font-bold px-2 py-1 rounded text-[10px] md:text-xs">${prod.cod_mat}</span> <span class="font-semibold truncate">${prod.descricao}</span>`;
        div.onclick = function() { selecionarProdutoEtiqueta(prod); };
        caixa.appendChild(div);
      });
      caixa.style.display = 'block';
    }

    function selecionarProdutoEtiqueta(prod) {
      document.getElementById('campoBusca').value = prod.descricao;
      document.getElementById('listaSugestoes').style.display = 'none';
      document.getElementById('lblDescricao').innerText = prod.descricao || "-";
      document.getElementById('lblTipo').innerText = prod.medida || "-";
      renderizarQR('qrCod', 'qrCodText', 'boxQrCod', 'lblCodTexto', prod.cod_mat);
      atualizarEtiqueta();
    }

    function formatarDataBR(dataString) {
      if (!dataString) return "-";
      var partes = dataString.split("-");
      if (partes.length !== 3) return dataString;
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    function atualizarEtiqueta() {
      var lote = document.getElementById('inpLote').value || "-";
      renderizarQR('qrLote', 'qrLoteText', 'boxQrLote', 'lblLoteTexto', lote);
      document.getElementById('lblQtd').innerText = document.getElementById('inpQtd').value || "1";
      var valDate = document.getElementById('inpValidade').value;
      var entDate = document.getElementById('inpEntrada').value;
      document.getElementById('lblValidade').innerText = formatarDataBR(valDate);
      document.getElementById('lblEntrada').innerText = formatarDataBR(entDate);
      
      var agora = new Date();
      var dataFormatada = ("0" + agora.getDate()).slice(-2) + "/" + ("0" + (agora.getMonth() + 1)).slice(-2) + "/" + agora.getFullYear() + " " + ("0" + agora.getHours()).slice(-2) + ":" + ("0" + agora.getMinutes()).slice(-2) + ":" + ("0" + agora.getSeconds()).slice(-2);
      document.getElementById('lblDataEmissao').innerText = "Data emissão: " + dataFormatada;
    }

    window.onload = function() {
      var hoje = new Date().toISOString().split('T')[0];
      document.getElementById('inpEntrada').value = hoje;
      atualizarEtiqueta();
    }

    document.addEventListener('click', function(event) {
      var caixa = document.getElementById('listaSugestoes');
      var inputBusca = document.getElementById('campoBusca');
      if (event.target !== inputBusca && !caixa.contains(event.target)) {
        caixa.style.display = 'none';
      }
    });
  </script>
</body>
</html>
